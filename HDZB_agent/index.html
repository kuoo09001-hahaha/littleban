<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小伴</title>
<style>
:root{--ink:#24332f;--muted:#64706c;--brand:#27806e;--cream:#fffaf1;--card:#fff;--line:#e6e1d7;--sun:#e99f28}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.app{max-width:1180px;min-height:100vh;margin:auto;padding:24px;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px}.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:0 10px 26px #754c120c}header{padding:27px 30px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:start;background:linear-gradient(125deg,#ecfbf5,#fff7df);border-radius:22px 22px 0 0}h1{margin:0;font-size:32px;letter-spacing:2px}.sub,.hint{color:var(--muted);font-size:16px;line-height:1.6}.sub{margin:8px 0 0}.badge{background:#d9f7e9;color:#176451;border-radius:99px;padding:9px 13px;font-size:14px;font-weight:600}.settings{padding:15px 28px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;flex-wrap:wrap}select,input,textarea{font:inherit;border:1px solid var(--line);border-radius:10px;background:#fff;padding:9px}label{font-size:16px;color:var(--muted)}.messages{height:calc(100vh - 280px);min-height:400px;overflow:auto;padding:22px 28px}.message{max-width:84%;padding:15px 17px;margin:12px 0;border-radius:17px;line-height:1.7;white-space:pre-wrap;font-size:18px}.user{background:#d9f5e8;margin-left:auto;border-bottom-right-radius:5px}.assistant{background:#fff6dc;border-bottom-left-radius:5px}.composer{border-top:1px solid var(--line);padding:17px 20px;display:flex;gap:11px}textarea{flex:1;resize:none;min-height:56px;max-height:140px;padding:14px;border:2px solid #d6ddd8;font-size:17px}button{border:0;border-radius:13px;min-height:48px;padding:0 16px;font:inherit;font-size:16px;font-weight:700;cursor:pointer;background:var(--brand);color:#fff}button:disabled{opacity:.55}.mic,.loc{background:var(--sun);font-size:22px;min-width:55px}aside{padding:22px;align-self:start}h2{margin:0 0 12px;font-size:22px}.family{padding-bottom:19px;border-bottom:1px solid var(--line);margin-bottom:20px}.member-select{width:100%;margin:7px 0 10px}.member-form{display:flex;gap:7px}.member-form input{min-width:0;flex:1}.member-form button{min-height:42px;font-size:15px;padding:0 11px}.remove-member{width:100%;min-height:40px;margin:0 0 10px;background:#fff;color:#ae5149;border:2px solid #efc9c4;font-size:15px}.reminder{border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0;font-size:17px}.time{color:var(--brand);font-weight:700}.done{background:#fff;color:var(--brand);border:2px solid #9fe0c9;margin-top:10px;min-height:40px}.toast{position:fixed;right:24px;bottom:24px;width:min(360px,calc(100vw - 48px));background:#134e4a;color:#fff;padding:16px;border-radius:13px;box-shadow:0 10px 25px #0003;display:none;z-index:9}.toast.show{display:block}.welcome{position:fixed;inset:0;background:#163c3288;display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}.welcome[hidden]{display:none}.welcome-card{width:min(420px,100%);padding:30px;background:#fffaf1;border-radius:22px;text-align:center;box-shadow:0 20px 45px #0004}.welcome-card h2{font-size:28px}.welcome-card input{width:100%;font-size:19px;margin:12px 0 16px;padding:13px}.welcome-card button{width:100%}@media(max-width:800px){.app{grid-template-columns:1fr;padding:12px}.messages{height:54vh;min-height:330px}aside{order:-1}header{padding:20px}}
</style></head><body><main class="app"><section class="panel"><header><div><h1>小伴 ☀️</h1><p class="sub">陪你聊天，也帮你记住重要的事</p></div><span class="badge" id="health">正在连接</span></header><div class="settings"><label>我想用 <select id="mode"><option value="elder">长辈模式</option><option value="child">儿童模式</option></select></label><button class="loc" id="location" type="button" title="告诉小伴我在哪儿，好帮我看天气">📍</button><span class="hint" id="location-status">还不知道您在哪儿</span></div><div class="messages" id="messages"><div class="message assistant">您好呀！我是小伴 😊<br>想聊天、问天气，或者说“每天中午提醒我吃药”，都可以告诉我。</div></div><form class="composer" id="form"><textarea id="input" placeholder="想说什么，就写在这里…" aria-label="输入想说的话" autofocus></textarea><button class="mic" id="mic" type="button" title="点一下开始说话，再点一下发送">🎙</button><button id="send">发送</button></form></section><aside class="panel"><section class="family"><h2>🏠 我的一家人</h2><p class="hint" id="current-member">当前聊天：正在准备…</p><select class="member-select" id="member"></select><button class="remove-member" id="remove-member" type="button">请这位家人离开</button><div class="member-form"><input id="new-member" maxlength="32" placeholder="姓名"><input id="new-age" type="number" min="0" max="130" placeholder="年龄"><button id="add-member" type="button">添加</button></div><p class="hint">添加姓名和年龄即可。关系可以聊天时告诉小伴，例如：“小明是我的孙子”。未满 18 岁会自动使用儿童模式。</p></section><h2>🔔 今天要做的事</h2><p class="hint">每天的提醒，今天完成后，明天还会再出现。</p><div id="reminders"><p class="hint">正在看看今天有没有要提醒的事…</p></div></aside></main><div class="toast" id="toast"></div><section class="welcome" id="welcome" hidden><div class="welcome-card"><h2>你好呀，我是小伴 ☀️</h2><p class="hint">怎么称呼您呢？<br>填好后，我会记住这是您的聊天和提醒。</p><input id="welcome-name" maxlength="32" placeholder="例如：奶奶、小明、王阿姨"><button id="welcome-submit">开始和小伴聊天</button></div></section>
<script>
const api=location.origin,el=id=>document.getElementById(id);const familyId=localStorage.getItem('xiaoban_family_id')||`family-${crypto.randomUUID()}`;localStorage.setItem('xiaoban_family_id',familyId);let actorName=localStorage.getItem('xiaoban_actor_name');if(actorName==='我'){actorName=null;localStorage.removeItem('xiaoban_actor_name')}let notified=new Set(),recorder,chunks=[],recording=false;const sessionId=()=>`web-${familyId}-${encodeURIComponent(actorName||'pending')}`;const addMessage=(text,role)=>{const n=document.createElement('div');n.className=`message ${role}`;n.textContent=text;el('messages').append(n);el('messages').scrollTop=el('messages').scrollHeight;return n};const toast=text=>{el('toast').textContent=`小伴提醒：${text}`;el('toast').classList.add('show');setTimeout(()=>el('toast').classList.remove('show'),10000)};async function json(path,opt){const r=await fetch(`${api}${path}`,opt);if(!r.ok)throw new Error((await r.json().catch(()=>({}))).detail||'请求没有成功');return r.json()}
let members=[];async function loadMembers(){const data=await json(`/agent/families/${encodeURIComponent(familyId)}/members`);members=data.members;const s=el('member');s.innerHTML='';members.forEach(m=>{const o=document.createElement('option');o.value=m.member_name;o.textContent=m.member_name;o.selected=m.member_name===actorName;s.append(o)});el('remove-member').disabled=!actorName}async function switchActor(name){actorName=name;localStorage.setItem('xiaoban_actor_name',name);el('current-member').textContent=`当前聊天：${name}`;const profile=members.find(m=>m.member_name===name);if(profile&&Number.isInteger(profile.age)){el('mode').value=profile.age<18?'child':'elder'}notified=new Set();el('messages').innerHTML=`<div class="message assistant">你好呀，${name}！我是小伴 😊</div>`;await loadLocation();await loadReminders();el('remove-member').disabled=false}async function addMember(name,age=null){await json(`/agent/families/${encodeURIComponent(familyId)}/members`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({member_name:name,age})});await loadMembers();await switchActor(name)}async function removeCurrentMember(){if(!actorName)return;const name=actorName;if(!confirm(`确定从“我的一家人”移除${name}吗？这会永久删除档案、提醒、位置和家庭记忆，无法恢复。`))return;await json(`/agent/families/${encodeURIComponent(familyId)}/members/${encodeURIComponent(name)}`,{method:'DELETE'});const data=await json(`/agent/families/${encodeURIComponent(familyId)}/members`);if(data.members.length){await loadMembers();await switchActor(data.members[0].member_name);toast(`已移除${name}`)}else{actorName=null;localStorage.removeItem('xiaoban_actor_name');el('member').innerHTML='';el('current-member').textContent='当前聊天：正在准备…';el('remove-member').disabled=true;el('welcome').hidden=false;toast(`已移除${name}`)}}el('member').onchange=e=>switchActor(e.target.value);el('remove-member').onclick=async()=>{try{await removeCurrentMember()}catch(e){toast(`没有删除成功：${e.message}`)}};el('add-member').onclick=async()=>{const i=el('new-member'),ageInput=el('new-age'),name=i.value.trim(),age=ageInput.value===''?null:Number(ageInput.value);if(!name||age===null){toast('请把姓名和年龄都填好。');return}i.value='';ageInput.value='';try{await addMember(name,age)}catch(e){toast(`没有添加成功：${e.message}`)}};el('welcome-submit').onclick=async()=>{const name=el('welcome-name').value.trim(),button=el('welcome-submit');if(!name){el('welcome-name').focus();return}button.disabled=true;button.textContent='正在记住…';try{await addMember(name);el('welcome').hidden=true}catch(e){toast(`暂时没能记住称呼：${e.message}`)}finally{button.disabled=false;button.textContent='开始和小伴聊天'}};el('welcome-name').onkeydown=e=>{if(e.key==='Enter')el('welcome-submit').click()};
async function loadReminders(){try{const data=await json(`/agent/reminders/${encodeURIComponent(sessionId())}`),box=el('reminders');box.innerHTML='';if(!data.reminders.length){box.innerHTML='<p class="hint">今天还没有要提醒的事。<br>可以说：“每天中午提醒我吃药”。</p>';return}data.reminders.forEach(item=>{const c=document.createElement('div');c.className='reminder';const daily=item.repeat_rule==='daily',when=daily?item.reminder_time:`${item.reminder_date||'今天'} ${item.reminder_time}`;c.innerHTML=`<div class="time">${when} · ${daily?'每天':'这一次'}</div><div>${item.title}</div>${item.completed_today?'<div class="hint">今天做完啦，明天我会再提醒您</div>':''}`;if(!item.completed_today){const b=document.createElement('button');b.className='done';b.textContent='我做完了 ✓';b.onclick=async()=>{await json(`/agent/reminders/${item.reminder_id}/complete`,{method:'POST'});loadReminders()};c.append(b)}const remove=document.createElement('button');remove.className='remove-member';remove.textContent='删除提醒';remove.onclick=async()=>{if(!confirm(`删除“${item.title}”提醒吗？`))return;await json(`/agent/reminders/${item.reminder_id}`,{method:'DELETE'});toast('提醒已删除');loadReminders()};c.append(remove);box.append(c)})}catch(_){el('reminders').innerHTML='<p class="hint">提醒暂时没有打开，请稍后再试。</p>'}}
async function loadLocation(){try{const d=await json(`/agent/location/${encodeURIComponent(sessionId())}`);el('location-status').textContent=d.location?`我在：${d.location.location_name}`:'还不知道您在哪儿'}catch(_){}}el('location').onclick=()=>{if(!navigator.geolocation){toast('这个浏览器不能告诉我位置。');return}el('location').disabled=true;el('location-status').textContent='正在找您在哪儿…';navigator.geolocation.getCurrentPosition(async p=>{try{const d=await json(`/agent/location/${encodeURIComponent(sessionId())}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({latitude:p.coords.latitude,longitude:p.coords.longitude})});el('location-status').textContent=`我在：${d.location.location_name}`;toast('记住啦！想出门时，问我天气就好。')}finally{el('location').disabled=false}},()=>{el('location-status').textContent='还不知道您在哪儿';el('location').disabled=false;toast('允许位置后，我就能帮您看当地天气。')},{timeout:10000,maximumAge:300000})};
async function checkDue(){try{const d=await json(`/agent/reminders/${encodeURIComponent(sessionId())}/due`);d.reminders.forEach(x=>{if(notified.has(x.reminder_id))return;notified.add(x.reminder_id);toast(`${x.reminder_time} ${x.title}`)})}catch(_){}}async function send(text){if(!actorName){el('welcome').hidden=false;return}addMessage(text,'user');el('send').disabled=true;const p=addMessage('小伴想一想…','assistant');try{const d=await json('/agent/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,session_id:sessionId(),family_id:familyId,actor_name:actorName,mode:el('mode').value})});p.textContent=d.response;if(d.command_type==='SET_ALARM'){loadReminders();toast('已经帮您记下来了')}}catch(e){p.textContent='小伴现在有点忙，请再说一次。'}finally{el('send').disabled=false;el('input').focus()}}el('form').onsubmit=e=>{e.preventDefault();const t=el('input').value.trim();if(t){el('input').value='';const hit=t.match(/(?:我是|我叫)(奶奶|爷爷|爸爸|妈妈|外婆|外公)/);if(hit&&hit[1]!==actorName){addMember(hit[1]).then(()=>send(t));}else send(t)}};el('input').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();el('form').requestSubmit()}};
async function sendVoice(blob){if(!actorName){el('welcome').hidden=false;return}const p=addMessage('正在听您说话…','assistant'),f=new FormData();f.append('file',new File([blob],`@${sessionId()}@voice-${Date.now()}.webm`,{type:blob.type||'audio/webm'}));f.append('mode',el('mode').value);f.append('family_id',familyId);f.append('actor_name',actorName);try{const r=await fetch('http://127.0.0.1:8015/agent/chat',{method:'POST',body:f});if(!r.ok)throw new Error();const d=await r.json();p.textContent=`您说：${d.asr_text}\n\n${d.ai_response}`;loadReminders()}catch(_){p.textContent='语音暂时没有听清，您可以再说一次或直接打字。'}finally{el('mic').disabled=false;el('mic').textContent='🎙'}}el('mic').onclick=async()=>{if(!actorName){el('welcome').hidden=false;return}if(recording){recorder.stop();recording=false;el('mic').disabled=true;el('mic').textContent='…';return}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>chunks.push(e.data);recorder.onstop=()=>{stream.getTracks().forEach(t=>t.stop());sendVoice(new Blob(chunks,{type:recorder.mimeType}))};recorder.start();recording=true;el('mic').textContent='■'}catch(_){toast('请允许浏览器使用麦克风。')}};(async()=>{try{await json('/agent/health');el('health').textContent='小伴在这儿'}catch(_){el('health').textContent='小伴休息中'}await loadMembers();if(actorName)await addMember(actorName);else el('welcome').hidden=false;checkDue();setInterval(checkDue,30000);setInterval(loadReminders,60000)})();
</script></body></html>
